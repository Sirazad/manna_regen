<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manna Regen – Mágikus Karakter Lap</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>⚗ Mágikus Karakter Lap</h1>
        <button id="resetBtn" class="btn btn-danger btn-sm" title="Reset character to defaults">↺ Reset</button>
    </header>

    <main>
        <!-- Character Settings -->
        <section class="card" id="characterSection">
            <h2>Karakter Beállítások</h2>
            <div class="grid-2">
                <!-- Magic Wielding Type -->
                <div class="field-group">
                    <label for="magicWieldingType">Mágia Forgatás Típusa</label>
                    <select id="magicWieldingType">
                        <option value="NONE">– Nincs –</option>
                        <option value="MAGIC_USER">Varázshasználó</option>
                        <option value="MAGE">Mágus</option>
                        <option value="WITCH">Boszorkány</option>
                        <option value="PRIEST">Pap</option>
                        <option value="PALADIN">Paladin</option>
                        <option value="BARD">Bárd</option>
                    </select>
                </div>

                <!-- Level -->
                <div class="field-group">
                    <label for="level">Szint (Level)</label>
                    <div class="inline-input">
                        <input type="number" id="level" min="0.5" step="0.5" value="1.0">
                        <button class="btn btn-primary btn-sm" onclick="applyLevel()">Alkalmaz</button>
                    </div>
                </div>

                <!-- Stamina -->
                <div class="field-group">
                    <label for="stamina">Állóképesség (Stamina)</label>
                    <div class="inline-input">
                        <input type="number" id="stamina" min="1" step="1" value="10">
                        <button class="btn btn-primary btn-sm" onclick="applyStamina()">Alkalmaz</button>
                    </div>
                </div>

                <!-- Magic Exhaustion Limit (read-only) -->
                <div class="field-group">
                    <label>Mágikus Kifáradás Határ</label>
                    <div class="stat-display" id="magicExhaustionLimit">25.00</div>
                </div>
            </div>
        </section>

        <!-- Manna and Pszi -->
        <section class="card" id="resourceSection">
            <h2>Erőforrások</h2>
            <div class="grid-2">
                <!-- Manna -->
                <div class="resource-group">
                    <h3>⚡ Manna</h3>
                    <div class="max-field">
                        <label for="maxManna">Maximum Manna</label>
                        <div class="inline-input">
                            <input type="number" id="maxManna" min="0" step="1" value="100">
                            <button class="btn btn-primary btn-sm" onclick="applyMaxManna()">Alkalmaz</button>
                        </div>
                    </div>
                    <div class="current-field">
                        <label>Jelenlegi Manna</label>
                        <div class="value-control">
                            <button class="btn btn-minus" onclick="adjustManna(-1)" title="-1">−1</button>
                            <span class="current-value" id="currentManna">100.00</span>
                            <button class="btn btn-plus" onclick="adjustManna(1)" title="+1">+1</button>
                        </div>
                        <div class="custom-adjust">
                            <input type="number" id="mannaAdjustAmt" placeholder="Mennyiség" step="0.5">
                            <button class="btn btn-minus btn-sm" onclick="adjustMannaByAmount(-1)">−</button>
                            <button class="btn btn-plus btn-sm" onclick="adjustMannaByAmount(1)">+</button>
                        </div>
                    </div>
                </div>

                <!-- Pszi -->
                <div class="resource-group">
                    <h3>🌀 Pszi</h3>
                    <div class="max-field">
                        <label for="maxPszi">Maximum Pszi</label>
                        <div class="inline-input">
                            <input type="number" id="maxPszi" min="0" step="1" value="50">
                            <button class="btn btn-primary btn-sm" onclick="applyMaxPszi()">Alkalmaz</button>
                        </div>
                    </div>
                    <div class="current-field">
                        <label>Jelenlegi Pszi</label>
                        <div class="value-control">
                            <button class="btn btn-minus" onclick="adjustPszi(-1)" title="-1">−1</button>
                            <span class="current-value" id="currentPszi">50.00</span>
                            <button class="btn btn-plus" onclick="adjustPszi(1)" title="+1">+1</button>
                        </div>
                        <div class="custom-adjust">
                            <input type="number" id="psziAdjustAmt" placeholder="Mennyiség" step="0.5">
                            <button class="btn btn-minus btn-sm" onclick="adjustPsziByAmount(-1)">−</button>
                            <button class="btn btn-plus btn-sm" onclick="adjustPsziByAmount(1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Magic Exhaustion Current -->
            <div class="exhaustion-row">
                <div class="field-group">
                    <label>Mágikus Kifáradás (Jelenlegi)</label>
                    <div class="exhaustion-bar-wrapper">
                        <div class="stat-display" id="currentExhaustion">25.00</div>
                        <div class="exhaustion-bar-bg">
                            <div class="exhaustion-bar-fill" id="exhaustionBarFill"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Time Display -->
        <section class="card" id="timeSection">
            <h2>⏱ Idő</h2>
            <div class="time-display" id="timeDisplay">
                <div class="time-unit"><span id="timeDays">0</span><small>nap</small></div>
                <div class="time-sep">:</div>
                <div class="time-unit"><span id="timeHours">0</span><small>óra</small></div>
                <div class="time-sep">:</div>
                <div class="time-unit"><span id="timeMinutes">00</span><small>perc</small></div>
                <div class="time-sep">:</div>
                <div class="time-unit"><span id="timeSeconds">00</span><small>mp (szegmens)</small></div>
            </div>
            <div class="time-segments">
                Összesen: <strong id="totalSegments">0</strong> szegmens
            </div>
        </section>

        <!-- Perform Action -->
        <section class="card action-card">
            <button class="btn btn-action" id="performActionBtn" onclick="openActionModal()">
                ⚔ Akció Végrehajtása
            </button>
        </section>
    </main>

    <!-- Action Modal -->
    <div id="actionModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Akció Végrehajtása</h2>
                <button class="modal-close" onclick="closeActionModal()" aria-label="Bezár">✕</button>
            </div>
            <div class="modal-body">
                <!-- Action Type Selection -->
                <div class="action-tabs">
                    <button class="tab-btn active" onclick="selectTab('spendPszi')">Pszi Elköltés</button>
                    <button class="tab-btn" onclick="selectTab('spendMana')">Manna Elköltés</button>
                    <button class="tab-btn" onclick="selectTab('skipTime')">Idő Ugrás</button>
                </div>

                <!-- Spend Pszi -->
                <div id="tab-spendPszi" class="tab-content active">
                    <div class="field-group">
                        <label>Pszi Mennyiség</label>
                        <input type="number" id="psziSpendAmount" min="0" step="0.5" placeholder="Elköltött Pszi">
                    </div>
                    <div class="field-group">
                        <label>Akció Ideje</label>
                        <div class="time-input-group">
                            <input type="number" id="psziSpendDays" min="0" placeholder="Nap" value="0">
                            <input type="number" id="psziSpendHours" min="0" max="23" placeholder="Óra" value="0">
                            <input type="number" id="psziSpendMinutes" min="0" max="59" placeholder="Perc" value="0">
                            <input type="number" id="psziSpendSeconds" min="0" max="59" placeholder="Mp" value="0">
                        </div>
                        <small>Vagy adja meg szegmensekben: <input type="number" id="psziSpendSegments" min="0" placeholder="Szegmens" style="width:100px"></small>
                    </div>
                    <button class="btn btn-action" onclick="doSpendPszi()">Végrehajtás</button>
                </div>

                <!-- Spend Mana -->
                <div id="tab-spendMana" class="tab-content">
                    <div class="field-group">
                        <label>Manna Mennyiség</label>
                        <input type="number" id="manaSpendAmount" min="0" step="0.5" placeholder="Elköltött Manna">
                    </div>
                    <div class="field-group">
                        <label>Akció Ideje</label>
                        <div class="time-input-group">
                            <input type="number" id="manaSpendDays" min="0" placeholder="Nap" value="0">
                            <input type="number" id="manaSpendHours" min="0" max="23" placeholder="Óra" value="0">
                            <input type="number" id="manaSpendMinutes" min="0" max="59" placeholder="Perc" value="0">
                            <input type="number" id="manaSpendSeconds" min="0" max="59" placeholder="Mp" value="0">
                        </div>
                        <small>Vagy adja meg szegmensekben: <input type="number" id="manaSpendSegments" min="0" placeholder="Szegmens" style="width:100px"></small>
                    </div>
                    <button class="btn btn-action" onclick="doSpendMana()">Végrehajtás</button>
                </div>

                <!-- Skip Time -->
                <div id="tab-skipTime" class="tab-content">
                    <div class="field-group">
                        <label for="skipActivity">Tevékenység</label>
                        <select id="skipActivity">
                            <option value="DEEP_MEDITATION">Mély Meditáció</option>
                            <option value="SLEEP">Alvás</option>
                            <option value="SITTING">Ülés</option>
                            <option value="COMFORTABLE_WALK">Kényelmes Séta / Lovagolás, könnyű mentális terhelés</option>
                            <option value="SPEED_RIDING_FIGHT">Sebességi Lovagolás, Harc, Nagy Mentális Terhelés</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label>Kihagyott Idő</label>
                        <div class="time-input-group">
                            <input type="number" id="skipDays" min="0" placeholder="Nap" value="0">
                            <input type="number" id="skipHours" min="0" max="23" placeholder="Óra" value="0">
                            <input type="number" id="skipMinutes" min="0" max="59" placeholder="Perc" value="0">
                            <input type="number" id="skipSeconds" min="0" max="59" placeholder="Mp" value="0">
                        </div>
                        <small>Vagy adja meg szegmensekben: <input type="number" id="skipSegments" min="0" placeholder="Szegmens" style="width:100px"></small>
                    </div>
                    <div class="field-group checkbox-group">
                        <label>
                            <input type="checkbox" id="maxPainPointsAffected">
                            Max fájdalompontok érintve (mágikus kifáradás nem töltődik)
                        </label>
                    </div>
                    <button class="btn btn-action" onclick="doSkipTime()">Végrehajtás</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Warning / Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal modal-sm">
            <div class="modal-header warning-header">
                <h2 id="confirmTitle">⚠ Figyelmeztetés</h2>
            </div>
            <div class="modal-body">
                <p id="confirmMessage"></p>
                <div class="confirm-buttons">
                    <button class="btn btn-danger" onclick="confirmAction()">Igen, folytatom</button>
                    <button class="btn btn-secondary" onclick="closeConfirmModal()">Mégse</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
